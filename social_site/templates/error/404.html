{% extends 'base.html' %}

{% block header %}

{% endblock %}

{% block content %}
<div class="error-page">
    <div class="__header">
        <h1>404</h1>
        <p>We must've lost this page.</p>
    </div>
    <div class="__footer">
        <a href="{{ url_for('index') }}" class="button variant-secondary">Home</a>
    </div>
</div>
{% endblock %}
