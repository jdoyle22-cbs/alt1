<!doctype html>

<html>

<head>
    <title>{% block title %}{% endblock %} - Social Site</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/base.css') }}">
    <!-- 
        Load HTMX and it's extensions.
        For debugging purposes, the full files are used. 
        Minified files should be used in production.
        -->
    <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='/js/htmax.js') }}"></script>
    <!-- CSP (Content Security Policy) support for HTMX -->
    <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='/js/hx-csp.js') }}"></script>
    <meta name="description" content="Flask Social Media Site">
    <meta name="keywords" content="Social, Media, Social Media">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block page_styles %}{% endblock %}
</head>

<body hx-ext="hx-csp" hx-nonce="{{ g.csp_nonce }}">
    <nav>
        <h1>Social Site</h1>
        <div class="account">
            {% if g.user %}
            <span>{{ g.user['username'] }}</span>
            <a href="{{ url_for('auth.logout') }}">Log Out</a>
            {% else %}
            <a href="{{ url_for('auth.register') }}">Register</a>
            <a href="{{ url_for('auth.login') }}">Log In</a>
            {% endif %}
        </div>
    </nav>
    <main>
        <header>
            {% block header %}{% endblock %}
        </header>
        {% block content %}{% endblock %}
    </main>
</body>

</html>
