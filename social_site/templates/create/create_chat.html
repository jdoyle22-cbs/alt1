{% extends 'base.html' %}

{% from "/components/form/submit_button.html" import submit_button %}

{% block header %}
<h1>{% block title %}Create Chat{% endblock %}</h1>
{% endblock %}

{% block content %}

<form     
    hx-post="{{ url_for('create.create_chat') }}"
    hx-target="#error"
    hx-swap="innerHTML"
    hx-nonce="{{ g.csp_nonce }}"
>
    {% cache 3600, 'create_chat_form_structure' %}
        <div>
            <label for="member_ids">Member ID's</label>
            <input type="text" name="member_ids" id="member_ids" class="width-full" required>
        </div>

        <div>
            <label for="title">Title</label>
            <input type="text" name="title" id="title" class="width-full" maxlength="50" required>
        </div>

        <div id="error"></div>

        {{ submit_button() }}
    {% endcache %}
</form>
{% endblock %}
