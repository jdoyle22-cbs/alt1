<nav class="mobile-nav __header hide-desktop">
    <div class="main">
        <button popovertarget="mobile-nav" class="variant-ghost icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
        </button>
    </div>
    <div class="account">
        {% if g.user %}
            <a class="button variant-ghost {% if request.path == '/create' %} active {% endif %}" href="/">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen preview-icon"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
            </a>
            <div class="menu-wrapper">
                <button class="variant-ghost" popovertarget="account-menu-mobile" aria-label="Account Menu">
                    <img src="data:image/png;base64,{{ g.user.profile_picture }}" width="34" height="34" alt="User Profile Picture" />
                </button>
                <menu popover id="account-menu-mobile">
                    <section>
                        <a href="/">My Profile</a>
                        <a href="/">Topics</a>
                    </section>
                    <hr />
                    <section>
                        <a href="/">Settings</a>
                        <a href="{{ url_for('auth.logout') }}" class="button variant-ghost destructive width-full">Logout</a>
                    </section>
                </menu>
            </div>
        {% else %}
            <div class="menu-wrapper">
                <button class="variant-ghost logged_out" popovertarget="account-menu-mobile">Account</button>
                <menu popover id="account-menu-mobile">
                    <section>
                        <a href="{{ url_for('auth.login') }}">Login</a>
                        <a href="{{ url_for('auth.register') }}">Register</a>
                    </section>
                </menu>
            </div>
        {% endif %}
    </div>
</nav>
