{% macro submit_button(text='Create', type='submit', aria_label='') -%}
    <button type="{{ type }}" class="variant-primary" hx-indicator="#loader" aria-label="{{ aria_label }}" :disabled="q('input[required]').arr().some(input => !input.value.trim())" :aria-busy="matches('.htmx-request')" hx-nonce="{{ g.csp_nonce }}">
        <svg xmlns="http://www.w3.org/2000/svg" class="animate-spin htmx-indicator" id="#loader" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        {{ text }}
    </button>
{%- endmacro %}
