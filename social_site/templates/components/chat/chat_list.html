<div class="post-list">
    {% if page.total == 0 %}
        <div class="card-error">
            <div class="__header">
                <p>There are no chatrooms.</p>
            </div>
            <div class="__footer">
                {% if not request.path == "/" %}
                    <a href="{{ url_for('index') }}" class="button variant-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house preview-icon"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                        Home
                    </a>
                {% endif %}
            </div>
        </div>
    {% else %}
        {% for chat in page %}
            {% include "components/chat/chat_card.html" with context %}
        {% endfor %}    
        {{ render_pagination(page, 'index') }}
    {% endif %}
</div>
