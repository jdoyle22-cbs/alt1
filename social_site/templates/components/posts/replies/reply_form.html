<button hx-nonce="{{ g.csp_nonce }}" class="variant-secondary" hx-on:click="this.closest('.reply-form').classList.add('hidden')">Reply</button>
<form 
    class="reply-form hidden"
    id="reply-form-{{ parent_id }}"
    {% if parent_type == "post" %}
        hx-post="{{ url_for('reply.create_post_reply', parent_id=parent_id, parent_type=parent_type) }}"
    {% elif parent_type == "reply" %}
        hx-post="{{ url_for('reply.create_reply_reply', parent_id=parent_id, parent_type=parent_type) }}"
    {% endif %}
    hx-target="reply_{{ parent_id }}_message"
    hx-swap="outerHTML"
    hx-nonce="{{ g.csp_nonce }}"
>
    <div class="textarea-container">
        <button class="textarea-button variant-primary" type="submit">Reply</button>
        <textarea name="reply_{{ parent_id }}_content" id="reply_{{ parent_id }}_content" hx-validate="true"></textarea>
    </div>
    <div id="reply_{{ parent_id }}_message"></div>
</form>
