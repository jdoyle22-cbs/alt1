<form>
    <dialog id="auth_dialog" class="advanced_dialog">
        <div class="__header">
            <div class="__name">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 9.807V6a1 1 0 00-1-1c-2 0-4.49-1.19-6.24-2.72a1.17 1.17 0 00-1.52 0C9.5 3.8 7 5 5 5a1 1 0 00-1 1v7c0 3.88 2.107 6.254 5 7.796"/><path d="M19 17v-2a2 2 0 00-4 0v2"/><rect x="13" y="17" width="8" height="5" rx="1"/></svg>
                <h1>Authentication</h1>
            </div>
            <button class="variant-ghost icon small" type="button" command="close" commandfor="auth_dialog" aria-label="Close Authentication Dialog">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
        <div class="__main">
            <div class="__content" hx-nonce="{{ g.csp_nonce }}" :hidden="q('.tab-signup').data.active == false" data-tab="signup">
                <section class="form-group">
                    <div class="input-form-wrapper">
                        <label for="username">
                            <span>Username</span>
                        </label>
                        <input type="text" id="username" name="username" value="" />
                    </div>
                    <div class="input-form-wrapper">
                        <label for="username">
                            <span>Display Name</span>
                        </label>
                        <input type="text" id="display_name" name="display_name" value="" />
                    </div>
                    <div class="input-form-wrapper">
                        <label for="email">
                            <span>Email</span>
                        </label>
                        <input type="text" id="email" name="email" value="" />
                    </div>
                    <div class="input-form-wrapper">
                        <label for="password">
                            <span>Password</span>
                        </label>
                        <input type="text" id="password" name="password" value="" />
                    </div>
                </section>
                <section>
                    <div class="input-form-wrapper">
                        <label for="remember_me">
                            <span aria-label="Setting Name">Remember me</span>
                            <span aria-label="Setting Description">Do not enable this on public devices.</span>
                        </label>
                        <input type="checkbox" id="remember_me" name="remember_me" />
                    </div>
                </section>
            </div>
            <div class="__content" hx-nonce="{{ g.csp_nonce }}" :hidden="q('.tab-login').data.active == false" data-tab="login">
                <section class="form-group">
                    <div class="input-form-wrapper no-bottom">
                        <label for="username">
                            <span>Username</span>
                        </label>
                        <input type="text" id="username" name="username" value="" />
                    </div>
                    <div class="input-form-wrapper no-top">
                        <label for="password">
                            <span>Password</span>
                        </label>
                        <input type="text" id="password" name="password" value="" />
                    </div>
                </section>
                <section>
                    <div class="input-form-wrapper">
                        <label for="remember_me">
                            <span aria-label="Setting Name">Remember me</span>
                            <span aria-label="Setting Description">Do not enable this on public devices.</span>
                        </label>
                        <input type="checkbox" id="remember_me" name="remember_me" />
                    </div>
                </section>
            </div>
        </div>
        <div class="__footer">
            <div class="button-group">
                <button 
                    class="button variant-secondary tab-signup"
                    data-active="true"
                    hx-on:click="
                        q('.tab-signup').data.active = true;
                        q('.tab-login').data.active = false;
                    "
                    hx-nonce="{{ g.csp_nonce }}"
                    type="button"
                >
                    Signup
                </button>
                <button 
                    class="button variant-secondary tab-login"
                    data-active="false"
                    hx-on:click="
                        q('.tab-signup').data.active = false;
                        q('.tab-login').data.active = true;
                    "
                    hx-nonce="{{ g.csp_nonce }}"
                    type="button"
                >
                    Login
                </button>
            </div>
            <div class="flex-row gap">
                <button
                    class="variant-ghost"
                    hx-nonce="{{ g.csp_nonce }}"
                    type="button"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
                    Use WebAuth
                </button>
                <button
                    class="variant-primary"
                    :hidden="q('.tab-signup').data.active == false"
                    hx-nonce="{{ g.csp_nonce }}"
                >
                    Signup
                </button>
                <button
                    class="variant-primary"
                    :hidden="q('.tab-login').data.active == false"
                    hx-nonce="{{ g.csp_nonce }}"
                >
                    Login
                </button>
            </div>
        </div>
    </dialog>
</form>
