<form>
    <dialog id="auth_dialog" class="advanced_dialog">
        <div class="__header">
            <div class="__name">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 9.807V6a1 1 0 00-1-1c-2 0-4.49-1.19-6.24-2.72a1.17 1.17 0 00-1.52 0C9.5 3.8 7 5 5 5a1 1 0 00-1 1v7c0 3.88 2.107 6.254 5 7.796"/><path d="M19 17v-2a2 2 0 00-4 0v2"/><rect x="13" y="17" width="8" height="5" rx="1"/></svg>
                <h1>Authentication</h1>
            </div>
            <button class="variant-ghost icon small" type="button" command="close" commandfor="auth_dialog" aria-label="Close Authentication Dialog">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
        <div class="__main">
            <div class="button-group width-full">
                <button 
                    class="button variant-secondary tab-signup width-full"
                    data-active="true"
                    hx-on:click="
                        q('.tab-signup').data.active = true;
                        q('.tab-login').data.active = false;
                    "
                    hx-nonce="{{ g.csp_nonce }}"
                    type="button"
                >
                    Signup
                </button>
                <button 
                    class="button variant-secondary tab-login width-full"
                    data-active="false"
                    hx-on:click="
                        q('.tab-signup').data.active = false;
                        q('.tab-login').data.active = true;
                    "
                    hx-nonce="{{ g.csp_nonce }}"
                    type="button"
                >
                    Login
                </button>
            </div>
            <div class="__content" hx-nonce="{{ g.csp_nonce }}" :hidden="q('.tab-signup').data.active == false" data-tab="signup">
                <section class="form-group">
                    <div class="input-form-wrapper">
                        <label for="signup_username">
                            <span>Username</span>
                        </label>
                        <input type="text" id="signup_username" name="signup_username" value="" />
                    </div>
                    <div class="input-form-wrapper">
                        <label for="signup_display_name">
                            <span>Display Name</span>
                        </label>
                        <input type="text" id="signup_display_name" name="signup_display_name" value="" />
                    </div>
                    <div class="input-form-wrapper">
                        <label for="signup_email">
                            <span>Email</span>
                        </label>
                        <input type="text" id="signup_email" name="signup_email" value="" />
                    </div>
                    <div class="input-form-wrapper">
                        <label for="signup_password">
                            <span>Password</span>
                        </label>
                        <input type="text" id="signup_password" name="signup_password" value="" />
                    </div>
                </section>
            </div>
            <div class="__content" hx-nonce="{{ g.csp_nonce }}" :hidden="q('.tab-login').data.active == false" data-tab="login">
                <section class="form-group">
                    <div class="input-form-wrapper no-bottom">
                        <label for="login_username">
                            <span>Username</span>
                        </label>
                        <input type="text" id="login_username" name="login_username" value="" />
                    </div>
                    <div class="input-form-wrapper no-top">
                        <label for="login_password">
                            <span>Password</span>
                        </label>
                        <input type="text" id="login_password" name="login_password" value="" />
                    </div>
                </section>
            </div>
        </div>
        <div class="__footer">
            <div></div>
            <div class="flex-row gap">
                <button
                    class="variant-ghost"
                    :hidden="q('.tab-login').data.active == false"
                    hx-nonce="{{ g.csp_nonce }}"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
                    Forgot Password?
                </button>
                <button
                    class="variant-primary"
                    hx-nonce="{{ g.csp_nonce }}"
                >
                    Continue
                </button>
            </div>
        </div>
    </dialog>
</form>
