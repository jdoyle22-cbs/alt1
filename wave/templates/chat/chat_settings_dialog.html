<dialog id="chat_settings_dialog">
    <div class="__header">
        <div class="__name">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
            <h1>Chat Settings</h1>
        </div>
        <button class="variant-ghost icon small" command="close" commandfor="chat_settings_dialog" aria-label="Close Chat Settings Dialog">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
    </div>
    <div class="__main">
        <div class="__tabs">
            <nav>
                <button 
                    class="button variant-ghost tab-general"
                    data-active="true"
                    hx-on:click="
                        q('.tab-general').data.active = true;
                        q('.tab-members').data.active = false;
                        q('.tab-about').data.active = false;
                    "
                    hx-nonce="{{ g.csp_nonce }}"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 10.27 7 3.34"/><path d="m11 13.73-4 6.93"/><path d="M12 22v-2"/><path d="M12 2v2"/><path d="M14 12h8"/><path d="m17 20.66-1-1.73"/><path d="m17 3.34-1 1.73"/><path d="M2 12h2"/><path d="m20.66 17-1.73-1"/><path d="m20.66 7-1.73 1"/><path d="m3.34 17 1.73-1"/><path d="m3.34 7 1.73 1"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="12" r="8"/></svg>
                    General
                </button>
                <button 
                    class="button variant-ghost tab-members"
                    data-active="false"
                    hx-on:click="
                        q('.tab-general').data.active = false;
                        q('.tab-members').data.active = true;
                        q('.tab-about').data.active = false;
                    "
                    hx-nonce="{{ g.csp_nonce }}"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21a8 8 0 0 1 10.821-7.487"/><path d="M21.378 16.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/><circle cx="10" cy="8" r="5"/></svg>
                    Members
                </button>
                <button 
                    class="button variant-ghost tab-about"
                    data-active="false"
                    hx-on:click="
                        q('.tab-general').data.active = false;
                        q('.tab-members').data.active = false;
                        q('.tab-about').data.active = true;
                    "
                    hx-nonce="{{ g.csp_nonce }}"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                    About
                </button>
            </nav>
        </div>
        <div class="__content" hx-nonce="{{ g.csp_nonce }}" :hidden="q('.tab-general').data.active == false" data-tab="general">
            <section class="form-group">
                <div class="input-form-wrapper no-bottom">
                    <label for="title">
                        <span aria-label="Setting Name">Title</span>
                        <span aria-label="Setting Description">Name this chat to find it easily.</span>
                    </label>
                    <input type="text" id="title" name="title" value="{{ chat.title }}" />
                </div>
                <div class="input-form-wrapper no-top">
                    <label for="chat_notifications">
                        <span aria-label="Setting Title">Notifications</span>
                        <span aria-label="Setting Description">Receive alerts about new activity in this chat.</span>
                    </label>
                    <input type="checkbox" id="chat_notifications" name="chat_notifications" />
                </div>
                <div class="input-form-wrapper no-top no-bottom">
                    <label for="chat_archived">
                        <span aria-label="Setting Name">Archive</span>
                        <span aria-label="Setting Description">Freeze this chat and prevent any new activity.</span>
                    </label>
                    <input type="checkbox" id="chat_archived" name="chat_archived" />
                </div>
            </section>
            <section>
                <div class="input-form-wrapper destructive">
                    <label for="delete">
                        <span aria-label="Setting Name">Delete</span>
                        <span aria-label="Setting Description">Permanently delete this chat. This cannot be undone.</span>
                    </label>
                    <button id="delete" class="variant-destructive">Delete</button>
                </div>
            </section>
        </div>
        <div class="__content" hx-nonce="{{ g.csp_nonce }}" :hidden="q('.tab-members').data.active == false" data-tab="members">
            <p>members</p>
        </div>
        <div class="__content" hx-nonce="{{ g.csp_nonce }}" :hidden="q('.tab-about').data.active == false" data-tab="about">
            <section class="form-group">
                <div class="input-form-wrapper" data-action="copy-content">
                    <label for="creation_date">
                        <span aria-label="Chat creation date">Created</span>
                    </label>
                    <button 
                        type="button" 
                        class="variant-ghost"
                        data-action="copy-content"
                        aria-describedby="created-label"
                        aria-label="Copy creation date"
                        id="creation_date"
                    >
                        <span data-copy>{{ chat.created_at }}</span>
                    </button>
                </div>
                <div class="input-form-wrapper">
                    <label>
                        <span>Test</span>
                    </label>
                    <button class="variant-secondary">Test</button>
                </div>
            </section>
        </div>
    </div>
    <div class="__footer">
        <button class="variant-primary">Save</button>
    </div>
</dialog>
