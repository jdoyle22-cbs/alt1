{% extends 'base.html' %}
{% from 'components/pagination.html' import render_pagination %}

{% block head %}
<style nonce="{{ g.csp_nonce }}">
    {% for chat in page %}
        #chat-{{ chat.id }} {
            view-transition-name: chat-{{ chat.id }};
        }
    {% endfor %}
</style>
{% endblock %}

{% block header %}
<h1>{% block title %}Chat{% endblock %}</h1>
<a class="button variant-ghost" href="{{ url_for('create.create_chat') }}">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
    New Chat
</a>
{% endblock %}

{% block content %}
    {% include "/components/chat/chat_list.html" with context %}
{% endblock %}
