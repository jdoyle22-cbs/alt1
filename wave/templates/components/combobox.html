{% macro combobox(search_type="", id="", name="", required=true) -%}
    <div class="menu-wrapper combobox">
        <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" class="animate-spin htmx-indicator combobox-loader-{{ id }}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-foreground)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
            <input 
                class="variant-ghost icon trigger combobox" 
                type="text"
                id="combobox-input-{{ id }}" 
                name="q"
                autocomplete="off"
                value=""
                hx-on:focus="document.getElementById('combobox-menu-{{ id }}').showPopover()"
                hx-on:blur="document.getElementById('combobox-menu-{{ id }}').hidePopover()"
                hx-nonce="{{ g.csp_nonce }}"
                hx-get="/search/{{ search_type }}?cbid={{ id }}"
                hx-trigger="keyup changed delay:300ms, search"
                hx-target="#search-results-{{ id }}"
                hx-indicator=".combobox-loader-{{ id }}"
                hx-swap="innerHTML"
                required="{{ required }}"
            />
            <input hidden name="{{ name }}" id="combobox-value-{{ id }}" />
        </div>
        <menu popover="manual" class="combobox-menu" id="combobox-menu-{{ id }}">
            <section class="htmx-indicator combobox-loader-{{ id }}">
                <li class="width-full">Searching...</li>
            </section>
            <section class="hide_on_load">
                <ul id="search-results-{{ id }}" class="menu-results">
                    <li>Start typing to see search results</li>
                </ul>
            </section>
        </menu>
    </div>
{%- endmacro %}
