<div class="reply">
    <div class="__header">
        <a href="/">@{{reply.user.display_name}}</a>
        <span>&#8226;</span>
        <span>{{reply.created_at}}</span>
    </div>
    <p>{{reply.text}}</p>
    <div class="__footer">
        {% with parent_id=reply.id, parent_type="reply" %}
            {% include "/components/posts/replies/reply_form_button.html" %}
        {% endwith %}
    </div>
    <div id="reply-form-reply_{{ reply.id }}"></div>
</div>
