<!DOCTYPE html>

<html lang="en">

<head>
    <title>{% block title %}{% endblock %} - Wave</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" as="style">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inter.css') }}" as="style">
    <!--  Load HTMX and it's extensions. -->
    <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='js/min/htmx.min.js') }}"></script>
    <!-- CSP (Content Security Policy) support for HTMX -->
    <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='js/min/hx-csp.min.js') }}"></script>
    <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='js/min/hx-live.min.js') }}"></script>
    <!--<script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='js/min/hx-download.min.js') }}" defer></script>-->
    <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='js/min/hx-preload.min.js') }}"></script>
    <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='js/min/hx-browser-indicator.min.js') }}"></script>
    <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='js/min/hx-head.min.js') }}"></script>
    <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='js/min/hx-browser-indicator.min.js') }}"></script>
    <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='js/min/hx-history-cache.min.js') }}"></script>

    <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='js/min/socket.io.min.js') }}"></script>
    
    <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='js/toast.js') }}" type="module" defer></script>
    <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='js/share.js') }}" type="module" defer></script>
    <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='js/htmx-compat.js') }}" type="module" defer></script>

    <script nonce="{{ g.csp_nonce }}">
        function updateActiveLinks() {
            const currentPath = window.location.pathname;
            
            document.querySelectorAll('.mobile-nav .links a, .sidebar_links .links a').forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        document.addEventListener("DOMContentLoaded", updateActiveLinks);
        document.addEventListener("htmx:after:init", updateActiveLinks);
    </script>

    <script nonce="{{ g.csp_nonce }}">
        console.info(`
            \x1B[41;1m┌───────────────────────────────┐\x1B[m 
            \x1B[41;1m│  ____  _____  ___   ____   _  │\x1B[m 
            \x1B[41;1m│ / ___||_   _|/ _ \\ |  _ \\ | | │\x1B[m 
            \x1B[41;1m│ \\___ \\  | | | | | || |_) || | │\x1B[m 
            \x1B[41;1m│  ___) | | | | |_| ||  __/ |_| │\x1B[m 
            \x1B[41;1m│ |____/  |_|  \\___/ |_|    (_) │\x1B[m 
            \x1B[41;1m└───────────────────────────────┘\x1B[m 

           Do you know what you're doing here?
                If you don't, leave now.

If anyone is asking you for information from this panel, 
       they are trying to compromise your account.

    \x1B[41;1m \u26A0 If you are certain you know what you are doing, \x1B[m 
    \x1B[41;1m    you may proceed at your own risk.               \x1B[m
        `)
    </script>

    <script nonce="{{ g.csp_nonce }}">
        htmx.config.safeEval = true;
        htmx.config.transitions = true;
        htmx.config.boostBrowserIndicator = true;
        htmx.config.historyCache.swapStyle = "outerMorph";
    </script>
    
    <meta name="description" content="Flask Social Media Site">
    <meta name="keywords" content="Social, Media, Social Media">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="icon" href="{{ url_for('static', filename='metadata/ico.svg') }}" type="image/svg+xml">
    {% block head %}{% endblock %}
</head>

<!-- main-site is here so that CSS from error pages doesn't apply -->
<body main-site hx-ext="hx-csp, live" hx-nonce="{{ g.csp_nonce }}" hx-boost:inherited="true transition:true">
    <a class="visually-hidden show-on-focus" href="#main-content">Skip to main content</a>
    {% include "components/navigation/sidebar.html" %}
    <div>
        {% include "auth/auth_dialog.html" %}
        {% include "components/navigation/navbar.html" %}
        <main>
            {% if not hide_header %}
                <header class="page-header">
                    {% block header %}{% endblock %}
                </header>
            {% endif %}
            <div id="main-content" tabindex="-1"></div>
            {% block content %}{% endblock %}
        </main>    
    </div>
    <div id="toast-container" hx-nonce="{{ g.csp_nonce }}" hx-preserve="true"></div>
</body>

</html>
