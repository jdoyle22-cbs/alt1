{% extends 'base.html' %}

{% from "/components/form/submit_button.html" import submit_button %}

{% block header %}
<h1>{% block title %}Create Topic{% endblock %}</h1>
{% endblock %}

{% block content %}

<form     
    hx-post="{{ url_for('create.create_topic') }}"
    hx-target="#error"
    hx-swap="innerHTML"
    hx-nonce="{{ g.csp_nonce }}"
    enctype="multipart/form-data"
>
    <section class="form-group">
        <div class="input-form-wrapper" for="name">
            <label for="topic_id">
                <span>Name</span>
                <span>Choose a short but relevant name.</span>
            </label>
            <input type="text" id="name" name="name" value="" required />
        </div>
        <div class="input-form-wrapper" for="description">
            <label for="topic_id">
                <span>Description</span>
                <span>Tell others what your topic is about, what to post etc.</span>
            </label>
            <input type="text" id="description" name="description" value="" required />
        </div>
        <div class="input-form-wrapper" for="image">
            <label for="image">
                <span>Image</span>
                <span>Small icon to represent your topic.</span>
            </label>
            <div class="file-upload">
                <label for="image" class="file-upload__label">
                    <span class="button variant-secondary">Choose file</span>
                    <span class="file-upload__text" id="image-status">No file selected</span>
                </label>

                <input
                    id="image"
                    class="file-upload__input"
                    type="file"
                    name="image"
                    aria-describedby="image-status"
                    accept="image/*"
                    required
                >
            </div>
        </div>
    </section>

    <section class="form-group">
        <div class="input-form-wrapper singular">
            <label>
                <span><div id="error"></div></span>
            </label>
            {{ submit_button() }}
        </div>
    <section>
</form>
{% endblock %}
