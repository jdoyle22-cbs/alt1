[project]
name = "wave"
version = "0.1.0"
description = "Social media site built with Flask"
readme = "README.md"
authors = [
    { name = "jamesdoyle22", email = "jamesdoyle22@student.cbsenniscorthy.ie" }
]
requires-python = ">=3.15.1"
dependencies = [
    "argon2-cffi>=25.1.0",
    "dotenv>=0.9.9",
    "feedgen>=1.0.0",
    "filetype>=1.2.0",
    "flask>=3.1.3",
    "flask-compress>=1.25",
    "flask-socketio>=5.7.0",
    "flask-sqlalchemy>=3.1.1",
    "humanize>=4.16.0",
    "icecream>=2.2.0",
    "pillow>=13.0.0",
    "rapidfuzz>=3.14.6",
]
package = false

[project.scripts]
wave = "wave:main"

[tool.ruff.lint]
typing-extensions = false

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "ty>=0.0.91",
]
